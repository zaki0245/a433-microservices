# =====================================================
# Secret MongoDB
# Menyimpan kredensial sensitif (username & password)
# dalam bentuk base64.
# =====================================================
apiVersion: v1
kind: Secret
metadata:
  # Nama Secret yang akan direferensikan StatefulSet
  name: mongo-secret
  labels:
    app: karsajobs
    tier: database
# Tipe Secret umum (key-value)
type: Opaque
data:
  # Username root MongoDB (base64 dari "admin")
  MONGO_ROOT_USERNAME: YWRtaW4=
  # Password root MongoDB (base64 dari "supersecretpassword")
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==
