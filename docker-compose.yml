# Kriteria 4: Menggunakan Docker Compose versi 2 atau lebih
version: "3.8"

services:
  # ====================
  # Service 1: item-app (Aplikasi Node.js)
  # ====================
  item-app:
    # [KRITERIA] Menggunakan image dari Docker Hub (bukan image lokal!)
    image: mzaki0245/item-app:v1  # <-- GANTI dengan username Docker Hub ANDA
    # [KRITERIA] Port mapping: host port 80 -> container port 8080
    ports:
      - "80:8080"
    # [KRITERIA] Pastikan item-app hanya berjalan setelah item-db diluncurkan
    depends_on:
      - item-db
    # [SARAN NILAI TAMBAH] Restart policy agar container selalu restart jika terhenti
    restart: unless-stopped
    # Environment variables (walaupun sudah di Dockerfile, dideklarasikan ulang agar jelas)
    environment:
      NODE_ENV: production
      DB_HOST: item-db

  # ====================
  # Service 2: item-db (Database MongoDB)
  # ====================
  item-db:
    # [KRITERIA] Menggunakan image mongo:3 dari Docker Hub
    image: mongo:3
    # [KRITERIA] Memakai volume bernama app-db dengan target /data/db
    volumes:
      - app-db:/data/db
    # [SARAN NILAI TAMBAH] Restart policy
    restart: unless-stopped

# [KRITERIA] Deklarasi volume yang digunakan
volumes:
  app-db: